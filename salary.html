<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت حقوق تولید</title>
    <style>
        /* --- استایل‌های پایه و اصلاح عرض صفحه --- */
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe import', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center; /* مرکز کردن افقی */
            min-height: 100vh;
        }

        /* ظرف اصلی که مشکل تو را حل می‌کند */
        .app-container {
            width: 100%;
            max-width: 850px; /* جلوگیری از کشیده شدن بیش از حد در مرورگر */
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); /* ایجاد عمق و زیبایی */
            margin-top: 20px;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }

        /* --- استایل تب‌ها --- */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            color: #7f8c8d;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 3px solid var(--accent-color);
        }

        /* --- استایل جداول و فرم‌ها --- */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #dfe6e9;
            text-align: center;
        }

        th {
            background-color: #f8f9fa;
            color: var(--primary-color);
        }

        input[type="number"], input[type="text"] {
            width: 80%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        /* جلوگیری از پرش فوکوس در هنگام تایپ */
        input:focus {
            outline: 2px solid var(--accent-color);
            border-color: transparent;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            margin: 5px;
        }

        .btn-primary { background: var(--accent-color); color: white; }
        .btn-success { background: var(--success-color); color: white; }
        .btn-danger { background: #e74c3c; color: white; }

        .summary-card {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: left; /* برای نمایش درست اعداد در فارسی */
        }

        .action-bar {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 600px) {
            .app-container { padding: 15px; }
            th, td { padding: 8px 4px; font-size: 0.85rem; }
            .tab-btn { padding: 8px 10px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>مدیریت حقوق تولید 🧵</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('settings')">تنظیمات قطعات</button>
        <button class="tab-btn" onclick="openTab('calc')">محاسبه حقوق</button>
        <button class="tab-btn" onclick="openTab('data')">بک‌آپ و مدیریت</button>
    </div>

    <!-- تب تنظیمات -->
    <div id="settings" class="tab-content active">
        <h2>تعریف قطعات و نرخ‌ها</h2>
        <div class="action-bar">
            <input type="text" id="new-part-name" placeholder="نام قطعه (مثلاً آستین)">
            <input type="number" id="new-part-price" placeholder="قیمت هر عدد">
            <button class="btn btn-primary" onclick="addPart()">افزودن قطعه</button>
        </div>
        <table id="parts-table">
            <thead>
                <tr>
                    <th>نام قطعه</th>
                    <th>قیمت واحد (تومان)</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- تب محاسبه -->
    <div id="calc" class="tab-content">
        <h2>محاسبه حقوق چرخکار</h2>
        <div class="action-bar">
            <button class="btn btn-success" onclick="loadAllPartsToCalc()">🔄 بارگذاری تمام قطعات</button>
        </div>
        <table id="calc-table">
            <thead>
                <tr>
                    <th>نام قطعه</th>
                    <th>قیمت واحد</th>
                    <th>تعداد تولید</th>
                    <th>جمع ردیف</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="summary-card" id="total-summary">
            مجموع کل حقوق: ۰ تومان
        </div>
    </div>

    <!-- تب مدیریت داده -->
    <div id="data" class="tab-content">
        <h2>مدیریت داده‌ها</h2>
        <p>برای جلوگیری از پاک شدن اطلاعات، حتماً بک‌آپ بگیرید.</p>
        <button class="btn btn-primary" onclick="exportJSON()">📥 خروجی گرفتن (Backup)</button>
        <button class="btn btn-success" onclick="importJSON()">📤 وارد کردن فایل (Restore)</button>
        <hr>
        <button class="btn btn-danger" onclick="clearAllData()">⚠️ پاک کردن تمام اطلاعات</button>
    </div>
</div>

<script>
    // --- منطق برنامه ---
    let parts = JSON.parse(localStorage.getItem('production_parts')) || [];

    function saveToStorage() {
        localStorage.setItem('production_parts', JSON.stringify(parts));
    }

    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(tabId === 'calc') renderCalcTable();
    }

    // مدیریت قطعات
    function addPart() {
        const name = document.getElementById('new-part-name').value;
        const price = parseFloat(document.getElementById('new-part-price').value);
        if(name && price) {
            parts.push({ name, price });
            saveToStorage();
            renderPartsTable();
            document.getElementById('new-part-name').value = '';
            document.getElementById('new-part-price').value = '';
        }
    }

    function renderPartsTable() {
        const tbody = document.querySelector('#parts-table tbody');
        tbody.innerHTML = '';
        parts.forEach((part, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${part.name}</td>
                    <td>${part.price.toLocaleString()}</td>
                    <td><button class="btn btn-danger" onclick="deletePart(${index})">حذف</button></td>
                </tr>
            `;
        });
    }

    function deletePart(index) {
        parts.splice(index, 1);
        saveToStorage();
        renderPartsTable();
    }

    // مدیریت محاسبه
    let calcItems = [];

    function loadAllPartsToCalc() {
        calcItems = parts.map(p => ({ ...p, count: 0 }));
        renderCalcTable();
    }

    function renderCalcTable() {
        const tbody = document.querySelector('#calc-table tbody');
        tbody.innerHTML = '';
        let grandTotal = 0;

        calcItems.forEach((item, index) => {
            const rowTotal = item.price * item.count;
            grandTotal += rowTotal;
            tbody.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.price.toLocaleString()}</td>
                    <td>
                        <input type="number" value="${item.count}" 
                               oninput="updateCount(${index}, this.value)" 
                               onkeydown="event.stopPropagation()">
                    </td>
                    <td id="row-total-${index}">${rowTotal.toLocaleString()}</td>
                </tr>
            `;
        });

        document.getElementById('total-summary').innerText = `مجموع کل حقوق: ${grandTotal.toLocaleString()} تومان`;
    }

    function updateCount(index, val) {
        const num = parseFloat(val) || 0;
        calcItems[index].count = num;
        
        // به‌روزرسانی فقط ردیف مورد نظر (برای جلوگیری از از دست رفتن فوکوس)
        const rowTotal = calcItems[index].price * num;
        document.getElementById(`row-total-${index}`).innerText = rowTotal.toLocaleString();
        
        // محاسبه مجدد جمع کل
        let grandTotal = 0;
        calcItems.forEach(item => grandTotal += (item.price * item.count));
        document.getElementById('total-summary').innerText = `مجموع کل حقوق: ${grandTotal.toLocaleString()} تومان`;
    }

    // مدیریت داده‌ها
    function exportJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(parts));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "production_backup.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    function importJSON() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.readAsText(file, 'UTF-8');
            reader.onload = readerEvent => {
                try {
                    const content = JSON.parse(readerEvent.target.result);
                    parts = content;
                    saveToStorage();
                    renderPartsTable();
                    alert('داده‌ها با موفقیت بازیابی شدند!');
                } catch (err) {
                    alert('خطا در خواندن فایل!');
                }
            }
        }
        input.click();
    }

    function clearAllData() {
        if(confirm('آیا از حذف تمام اطلاعات مطمئن هستید؟')) {
            parts = [];
            saveToStorage();
            renderPartsTable();
        }
    }

    // لود اولیه
    renderPartsTable();
</script>

</body>
</html>
